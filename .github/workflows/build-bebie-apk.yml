name: Build Bebie AI Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/build-bebie-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Bebie AI Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Android Platform 36 & Licenses
        run: |
          if command -v sdkmanager &> /dev/null; then
            yes | sdkmanager --licenses || true
            sdkmanager "platforms;android-36" "build-tools;36.0.0" || true
          elif [ -n "$ANDROID_HOME" ]; then
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'apps/mobile/package-lock.json'

      - name: Install Mobile Dependencies
        working-directory: apps/mobile
        run: npm ci || npm install

      - name: Setup Mobile Environment Variables
        working-directory: apps/mobile
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=https://db.absgroup.biz.id" > .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzg4MjMxMjM2LCJleHAiOjE5NDU5MTEyMzZ9.nNHFrq9e9IJ6kLXEea5lfzOUa8a0506kFg3nyNZEyHU" >> .env
          echo "EXPO_PUBLIC_API_URL=https://task.absgroup.biz.id" >> .env

      - name: Prebuild Native Android Project
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://db.absgroup.biz.id
          EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzg4MjMxMjM2LCJleHAiOjE5NDU5MTEyMzZ9.nNHFrq9e9IJ6kLXEea5lfzOUa8a0506kFg3nyNZEyHU
          EXPO_PUBLIC_API_URL: https://task.absgroup.biz.id
        run: npx expo prebuild --platform android --clean

      - name: Grant execute permission for gradlew
        run: chmod +x apps/mobile/android/gradlew

      - name: Build Android Debug APK
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://db.absgroup.biz.id
          EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzg4MjMxMjM2LCJleHAiOjE5NDU5MTEyMzZ9.nNHFrq9e9IJ6kLXEea5lfzOUa8a0506kFg3nyNZEyHU
          EXPO_PUBLIC_API_URL: https://task.absgroup.biz.id
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk build-output/BebieAI.apk

      - name: Upload Bebie AI APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BebieAI-Android-APK
          path: build-output/BebieAI.apk
          retention-days: 30
