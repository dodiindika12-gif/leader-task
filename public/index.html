<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Busana - Beauty Task Management</title>
  <meta name="theme-color" content="#e1007a">
  <link rel="icon" href="./favicon.ico">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #fff1f8 0%, #fdf2f8 50%, #f5f3ff 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      color: #0f172a;
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      padding: 32px 28px;
      border-radius: 28px;
      box-shadow: 0 20px 40px -15px rgba(225, 0, 122, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.8);
      max-width: 360px;
      width: 100%;
      animation: fadeIn 0.4s ease-out;
    }
    .logo-box {
      width: 76px;
      height: 76px;
      border-radius: 24px;
      background: linear-gradient(135deg, #e1007a 0%, #ec268f 60%, #a855f7 100%);
      padding: 2px;
      margin: 0 auto 16px;
      box-shadow: 0 10px 25px rgba(225, 0, 122, 0.25);
    }
    .logo-inner {
      width: 100%;
      height: 100%;
      background: #ffffff;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 8px;
    }
    .logo-inner img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    h1 {
      font-family: 'Pacifico', cursive, sans-serif;
      color: #0f172a;
      font-size: 28px;
      margin-bottom: 4px;
    }
    p.tagline {
      font-size: 11px;
      font-weight: 700;
      color: #be185d;
      letter-spacing: 0.5px;
      margin-bottom: 24px;
      text-transform: uppercase;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(225, 0, 122, 0.15);
      border-top-color: #e1007a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    .status-text {
      font-size: 12px;
      color: #64748b;
      font-weight: 500;
    }
    .retry-btn {
      display: none;
      margin-top: 16px;
      background: linear-gradient(135deg, #e1007a 0%, #ec268f 100%);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(225, 0, 122, 0.25);
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-box">
      <div class="logo-inner">
        <img src="./Logo Beauty.png" alt="Busana Logo">
      </div>
    </div>
    <h1>Busana</h1>
    <p class="tagline">Beauty Task Management</p>
    <div class="spinner" id="spinner"></div>
    <div class="status-text" id="status">Memuat aplikasi...</div>
    <button class="retry-btn" id="retryBtn" onclick="location.reload()">Muat Ulang</button>
  </div>

  <script>
    // Langsung arahkan ke server aplikasi Busana
    const targetUrl = "https://task.absgroup.biz.id";
    
    if (navigator.onLine !== false) {
      try {
        window.location.replace(targetUrl);
      } catch(e) {
        window.location.href = targetUrl;
      }
    }

    setTimeout(() => {
      const statusEl = document.getElementById('status');
      const retryBtn = document.getElementById('retryBtn');
      const spinner = document.getElementById('spinner');

      if (!navigator.onLine) {
        statusEl.innerText = 'Tidak ada koneksi internet. Pastikan perangkat Anda terhubung ke jaringan.';
        statusEl.style.color = '#e11d48';
        spinner.style.display = 'none';
        retryBtn.style.display = 'inline-block';
      } else {
        window.location.href = targetUrl;
      }
    }, 2000);
  </script>
</body>
</html>
